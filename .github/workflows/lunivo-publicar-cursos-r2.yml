name: Lunivo - Publicar cursos R2

# Novas aulas são arquivos JSON no R2; NÃO geram novo APK.
# Envie curso-lunivo-*.zip para a raiz do repositório.
# Executar manualmente valida as credenciais sem publicar conteúdo.
on:
  push:
    branches: [main]
    paths:
      - 'curso-lunivo-*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lunivo-publicar-cursos-r2-main
  cancel-in-progress: false

jobs:
  publicar:
    name: Validar unidades e publicar no R2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LUNIVO_R2_ACCOUNT_ID: de4d3179ca7e143ad3277ac32e681690
      LUNIVO_R2_ACCESS_KEY_ID: ${{ secrets.LUNIVO_R2_ACCESS_KEY_ID }}
      LUNIVO_R2_SECRET_ACCESS_KEY: ${{ secrets.LUNIVO_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar cliente S3
        run: python -m pip install --disable-pip-version-check boto3==1.40.70

      - name: Verificar publicador e conteúdo
        run: |
          python -m unittest discover -s backend/tests -p 'test_course_publisher.py' -v
          test -s backend/scripts/publish_course_packages.py

      - name: Conferir credenciais (sem revelar valores)
        shell: bash
        run: |
          set -euo pipefail
          for name in LUNIVO_R2_ACCESS_KEY_ID LUNIVO_R2_SECRET_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Segredo ausente: ${name}"
              exit 1
            fi
          done

      - name: Verificar R2 ou publicar unidades
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            python backend/scripts/publish_course_packages.py --check-only
            echo 'uploaded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t packs < <(git ls-files -- 'curso-lunivo-*.zip' | sort)
          if [ "${#packs[@]}" -eq 0 ]; then
            echo 'Nenhum ZIP de curso para publicar.'
            echo 'uploaded=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python backend/scripts/publish_course_packages.py "${packs[@]}"
          printf '%s\n' "${packs[@]}" > "$RUNNER_TEMP/lunivo-cursos-enviados.txt"
          echo 'uploaded=true' >> "$GITHUB_OUTPUT"
          echo '## Unidades do Lunivo publicadas no R2' >> "$GITHUB_STEP_SUMMARY"

      - name: Remover lotes temporários após publicação
        if: ${{ steps.publish.outputs.uploaded == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            git rm --ignore-unmatch -- "$f"
          done < "$RUNNER_TEMP/lunivo-cursos-enviados.txt"
          if ! git diff --cached --quiet; then
            git commit -m 'Remover lotes de cursos publicados no R2'
            git push origin HEAD:main
          fi
