name: Lunivo - Android otimizado (APK e AAB)

# APK/AAB so quando necessario. ZIPs que mudam apenas backend/docs nao
# disparam a compilacao do Android. Mudancas na parte mobile continuam
# gerando APK e AAB ate configurarmos uma rotina OTA com Expo Updates.
# Segredos existentes: LUNIVO_ANDROID_KEYSTORE_BASE64,
# LUNIVO_ANDROID_KEYSTORE_PASSWORD, LUNIVO_ANDROID_KEY_ALIAS,
# LUNIVO_ANDROID_KEY_PASSWORD.

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Aplicar pacote Lunivo
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'plugins/**'
      - 'app.json'
      - 'app.config.*'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tests/**'
      - 'babel.config.*'
      - 'metro.config.*'

permissions:
  contents: read

concurrency:
  group: lunivo-android-build-main
  cancel-in-progress: false

jobs:
  decidir:
    name: Identificar alteracoes (sem compilar Android)
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      compilar: ${{ steps.analise.outputs.compilar }}
    steps:
      - name: Obter codigo e historico
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Decidir se o Android precisa ser recompilado
        id: analise
        shell: bash
        env:
          ORIGEM: ${{ github.event_name }}
          SHA_ANTES_DO_PACOTE: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$ORIGEM" != 'workflow_run' ]; then
            echo 'compilar=true' >> "$GITHUB_OUTPUT"
            echo 'Evento manual ou alteracao direta no codigo mobile: compilar.'
            exit 0
          fi
          if [ -z "${SHA_ANTES_DO_PACOTE:-}" ] || \
             ! git cat-file -e "${SHA_ANTES_DO_PACOTE}^{commit}" 2>/dev/null || \
             ! git merge-base --is-ancestor "$SHA_ANTES_DO_PACOTE" HEAD; then
            # Seguranca: se nao conseguimos provar que a mudanca era so do backend,
            # compilamos o Android em vez de ignorar uma alteracao relevante.
            echo '::warning::Nao foi possivel determinar as alteracoes. Compilacao conservadora.'
            echo 'compilar=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z "$SHA_ANTES_DO_PACOTE" HEAD > /tmp/lunivo-arquivos-modificados
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          paths = [p.decode('utf-8') for p in Path('/tmp/lunivo-arquivos-modificados').read_bytes().split(b'\0') if p]
          def nao_exige_android(path: str) -> bool:
              return (
                  path.startswith(('backend/', 'docs/')) or
                  (path.startswith('pacote-') and path.endswith('.zip') and '/' not in path) or
                  path in {'README.md', '.gitignore', 'LICENSE', '.editorconfig'}
              )
          relevantes = [p for p in paths if not nao_exige_android(p)]
          compilar = bool(relevantes)
          print('Arquivos modificados:', paths or '(nenhum)')
          print('Arquivos que exigem novo Android:', relevantes or '(nenhum)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"compilar={'true' if compilar else 'false'}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('# Lunivo - decisao de compilacao Android\n\n')
              f.write('**Resultado:** ' + ('Compilar APK e AAB' if compilar else 'Nao compilar: somente backend/docs') + '\n\n')
              f.write('Arquivos analisados:\n\n')
              f.write(''.join('- `' + p.replace('`', '') + '`\n' for p in paths) if paths else '(nenhuma alteracao)\n')
          PYTHON

  android:
    name: Android assinado (somente quando necessario)
    needs: decidir
    if: ${{ needs.decidir.outputs.compilar == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Obter ultima versao aprovada
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4

      - name: Preparar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias verificadas
        run: npm ci --no-audit --no-fund

      - name: Executar testes e checagem de tipos
        run: |
          npm run typecheck
          npm test

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --clean --no-install

      - name: Ativar R8 e remocao de recursos nao usados
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android.enableMinifyInReleaseBuilds' android/app/build.gradle
          grep -Fq 'android.enableShrinkResourcesInReleaseBuilds' android/app/build.gradle
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('android/gradle.properties')
          keys = {'android.enableMinifyInReleaseBuilds', 'android.enableShrinkResourcesInReleaseBuilds'}
          lines = [line for line in p.read_text().splitlines() if line.split('=', 1)[0].strip() not in keys]
          for key in sorted(keys):
              lines.append(f'{key}=true')
          p.write_text('\n'.join(lines) + '\n')
          print('R8 e shrinkResources ativados')
          PYTHON

      - name: Restaurar JKS original do Expo
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LUNIVO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUNIVO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUNIVO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LUNIVO_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Falta um dos segredos de assinatura: ${var}"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lunivo-signing.jks"
          test -s "$RUNNER_TEMP/lunivo-signing.jks"
          chmod 600 "$RUNNER_TEMP/lunivo-signing.jks"
          echo "LUNIVO_KEYSTORE_PATH=$RUNNER_TEMP/lunivo-signing.jks" >> "$GITHUB_ENV"

      - name: Configurar assinatura no Gradle gerado
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          // Assinatura Lunivo, injetada apenas durante o build CI.
          android {
              signingConfigs {
                  lunivoRelease {
                      storeFile file(System.getenv("LUNIVO_KEYSTORE_PATH"))
                      storePassword System.getenv("LUNIVO_ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("LUNIVO_ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("LUNIVO_ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.lunivoRelease
                  }
              }
          }
          GRADLE

      - name: Compilar APK e AAB release assinados
        working-directory: android
        env:
          LUNIVO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LUNIVO_ANDROID_KEYSTORE_PASSWORD }}
          LUNIVO_ANDROID_KEY_ALIAS: ${{ secrets.LUNIVO_ANDROID_KEY_ALIAS }}
          LUNIVO_ANDROID_KEY_PASSWORD: ${{ secrets.LUNIVO_ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --build-cache

      - name: Conferir assinaturas dos arquivos gerados
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          ls -lh "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --print-certs "$apk"
          aab="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$aab" && test -s "$aab"
          jarsigner -verify "$aab" | tail -n 8

      - name: Criar relatorio de tamanho Android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, zipfile, hashlib, os
          from pathlib import Path
          from collections import defaultdict

          apk = next(Path('android/app/build/outputs/apk/release').glob('*.apk'))
          aab = next(Path('android/app/build/outputs/bundle/release').glob('*.aab'))
          categories = defaultdict(lambda: [0, 0])
          abis = defaultdict(lambda: [0, 0])
          def category(name):
              if name.startswith('lib/'): return 'Bibliotecas nativas (.so)'
              if name.startswith('assets/'): return 'Assets / bundle JavaScript'
              if name.startswith('res/'): return 'Recursos Android (res/)'
              if name.endswith('.dex') or name.startswith('classes'): return 'Codigo Android (.dex)'
              if name.startswith('META-INF/'): return 'Metadados de assinatura'
              return 'Outros'
          with zipfile.ZipFile(apk) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  group = categories[category(item.filename)]
                  group[0] += item.compress_size
                  group[1] += item.file_size
                  if item.filename.startswith('lib/'):
                      parts = item.filename.split('/')
                      if len(parts) > 2:
                          abi = abis[parts[1]]
                          abi[0] += item.compress_size
                          abi[1] += item.file_size
          mib = lambda n: f'{n / (1024 * 1024):.2f} MiB'
          table = ['# Lunivo - relatorio do pacote Android', '',
                   f'- APK universal: **{mib(apk.stat().st_size)}**',
                   f'- AAB de distribuicao: **{mib(aab.stat().st_size)}**',
                   '- Compilacao: release, com R8 e shrinkResources habilitados',
                   '- O tamanho do AAB nao representa o tamanho de download da Google Play.',
                   '', '## Conteudo do APK', '',
                   '| Categoria | Compactado | Descompactado |', '|---|---:|---:|']
          for cat, values in sorted(categories.items(), key=lambda x: -x[1][0]):
              table.append(f'| {cat} | {mib(values[0])} | {mib(values[1])} |')
          table += ['', '## Bibliotecas por arquitetura', '',
                    '| Arquitetura | Compactado | Descompactado |', '|---|---:|---:|']
          for abi, values in sorted(abis.items(), key=lambda x: -x[1][0]):
              table.append(f'| {abi} | {mib(values[0])} | {mib(values[1])} |')
          report = '\n'.join(table) + '\n'
          Path('lunivo-size-report.md').write_text(report)
          Path('lunivo-size-report.json').write_text(json.dumps({
              'apk_bytes': apk.stat().st_size, 'aab_bytes': aab.stat().st_size,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'categories': dict(categories), 'abis': dict(abis),
          }, indent=2))
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(report)
          PYTHON

      - name: Publicar APK para download por 14 dias
        uses: actions/upload-artifact@v4
        with:
          name: lunivo-android-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publicar AAB para testes de distribuicao
        uses: actions/upload-artifact@v4
        with:
          name: lunivo-android-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Publicar relatorio de tamanhos
        uses: actions/upload-artifact@v4
        with:
          name: lunivo-android-relatorio-${{ github.run_number }}
          path: |
            lunivo-size-report.md
            lunivo-size-report.json
          retention-days: 14
          if-no-files-found: error
